<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Woolly body -->
  <ellipse cx="16" cy="20" rx="10" ry="8" fill="#FDF4E3"/>
  <!-- Woolly fluffy texture -->
  <circle cx="10" cy="18" r="3" fill="#FAE8C8"/>
  <circle cx="16" cy="16" r="3" fill="#FAE8C8"/>
  <circle cx="22" cy="18" r="3" fill="#FAE8C8"/>
  <circle cx="13" cy="22" r="2.5" fill="#FAE8C8"/>
  <circle cx="19" cy="22" r="2.5" fill="#FAE8C8"/>
  <!-- Neck -->
  <rect x="20" y="8" width="4" height="10" rx="2" fill="#FDF4E3"/>
  <!-- Head -->
  <ellipse cx="22" cy="7" rx="5" ry="4" fill="#FDF4E3"/>
  <!-- Ears -->
  <ellipse cx="18" cy="4" rx="1.5" ry="2.5" fill="#FFCDD2"/>
  <ellipse cx="26" cy="4" rx="1.5" ry="2.5" fill="#FFCDD2"/>
  <!-- Eyes -->
  <circle cx="20" cy="6" r="1.2" fill="#4A4A4A"/>
  <circle cx="24" cy="6" r="1.2" fill="#4A4A4A"/>
  <!-- Blush -->
  <circle cx="18" cy="8" r="1" fill="#FFAB91" opacity="0.6"/>
  <circle cx="26" cy="8" r="1" fill="#FFAB91" opacity="0.6"/>
  <!-- Legs -->
  <rect x="9" y="25" width="2" height="5" rx="1" fill="#D7CCC8"/>
  <rect x="14" y="25" width="2" height="5" rx="1" fill="#D7CCC8"/>
  <rect x="18" y="25" width="2" height="5" rx="1" fill="#D7CCC8"/>
  <rect x="23" y="25" width="2" height="5" rx="1" fill="#D7CCC8"/>
</svg>
