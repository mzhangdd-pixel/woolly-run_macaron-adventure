<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Woolly body - dark brown -->
  <ellipse cx="16" cy="20" rx="10" ry="8" fill="#5D4037"/>
  <!-- Woolly fluffy texture -->
  <circle cx="10" cy="18" r="3" fill="#4E342E"/>
  <circle cx="16" cy="16" r="3" fill="#4E342E"/>
  <circle cx="22" cy="18" r="3" fill="#4E342E"/>
  <circle cx="13" cy="22" r="2.5" fill="#4E342E"/>
  <circle cx="19" cy="22" r="2.5" fill="#4E342E"/>
  <!-- Neck -->
  <rect x="20" y="8" width="4" height="10" rx="2" fill="#5D4037"/>
  <!-- Head -->
  <ellipse cx="22" cy="7" rx="5" ry="4" fill="#5D4037"/>
  <!-- Ears - pink inside -->
  <ellipse cx="18" cy="4" rx="1.5" ry="2.5" fill="#6D4C41"/>
  <ellipse cx="26" cy="4" rx="1.5" ry="2.5" fill="#6D4C41"/>
  <ellipse cx="18" cy="4" rx="0.8" ry="1.5" fill="#FFAB91"/>
  <ellipse cx="26" cy="4" rx="0.8" ry="1.5" fill="#FFAB91"/>
  <!-- Eyes - bright -->
  <circle cx="20" cy="6" r="1.2" fill="#FFFFFF"/>
  <circle cx="24" cy="6" r="1.2" fill="#FFFFFF"/>
  <circle cx="20.3" cy="6" r="0.6" fill="#1A1A1A"/>
  <circle cx="24.3" cy="6" r="0.6" fill="#1A1A1A"/>
  <!-- Blush -->
  <circle cx="18" cy="8" r="1" fill="#FF8A65" opacity="0.5"/>
  <circle cx="26" cy="8" r="1" fill="#FF8A65" opacity="0.5"/>
  <!-- Legs - darker -->
  <rect x="9" y="25" width="2" height="5" rx="1" fill="#3E2723"/>
  <rect x="14" y="25" width="2" height="5" rx="1" fill="#3E2723"/>
  <rect x="18" y="25" width="2" height="5" rx="1" fill="#3E2723"/>
  <rect x="23" y="25" width="2" height="5" rx="1" fill="#3E2723"/>
</svg>
